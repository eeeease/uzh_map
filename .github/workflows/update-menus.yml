name: Refresh weekly menus and images

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-menu-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch menus and licensed dish images
        run: node scripts/update-menus.mjs
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu-week.json images/dishes
          if git diff --cached --quiet; then
            echo "No menu changes"
            exit 0
          fi
          git commit -m "chore: refresh weekly menus and images"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
