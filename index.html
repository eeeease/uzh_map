<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>UZH × ETH Mensa Map</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./styles.css?v=20260828-2">
</head>
<body>
<div id="app" data-mode="map">
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>UZH × ETH Mensa Map</h1>
        <p id="subtitle">按菜品反查餐厅与日期 · 每周菜单 · 苏黎世范围</p>
      </div>
      <div class="headerControls">
        <div class="seg" id="languageBar" aria-label="语言">
          <button class="active" data-lang="zh">中文</button>
          <button data-lang="en">EN</button>
          <button data-lang="de">DE</button>
        </div>
        <div class="seg modeSwitch" id="modeBar" aria-label="显示模式">
          <button class="active" data-mode="map">地图</button>
          <button data-mode="list">列表</button>
        </div>
        <button id="locateBtn" class="button primary">◎ 定位我</button>
        <button id="fitBtn" class="button">显示全部</button>
      </div>
    </div>
    <div class="filterRow">
      <div class="seg" id="schoolBar" aria-label="学校筛选">
        <button class="active" data-school="ALL">全部</button>
        <button data-school="UZH">UZH</button>
        <button data-school="ETH">ETH</button>
      </div>
      <div class="seg" id="mealBar" aria-label="餐次筛选">
        <button class="active" data-meal="ALL">全部</button>
        <button data-meal="LUNCH">午餐</button>
        <button data-meal="DINNER">晚餐</button>
        <button data-meal="OPEN">现在营业</button>
      </div>
      <label class="searchWrap">
        <span id="searchLabel" class="srOnly">搜索餐厅、校区或菜品…</span>
        <input id="searchInput" type="search" placeholder="搜索餐厅、校区或菜品…">
      </label>
    </div>
    <div class="scrollFilters">
      <div id="dateBar" class="pillRow" aria-label="日期筛选"></div>
      <div id="categoryBar" class="pillRow" aria-label="菜品分类"></div>
    </div>
  </header>

  <main id="mapPanel" class="mapPanel">
    <div id="map"></div>
    <div id="statusbar" class="statusbar" role="status"></div>
    <div class="legend">
      <span><i class="dot uzh"></i>UZH</span>
      <span><i class="dot eth"></i>ETH</span>
      <span><i class="dot me"></i><span id="legendMe">我的位置</span></span>
    </div>
  </main>

  <main id="listPanel" class="listPanel" hidden>
    <div class="contentWidth">
      <div class="resultHead">
        <div>
          <h2 id="resultTitle">本周菜品</h2>
          <p id="dataStamp"></p>
        </div>
        <span id="resultCount" class="count"></span>
      </div>
      <div id="results" class="dayGroups"></div>
    </div>
  </main>

  <main id="detailPanel" class="detailPanel" hidden>
    <div class="contentWidth detailWidth">
      <button id="backBtn" class="backButton">← 返回</button>
      <div id="detailContent"></div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js?v=20260828-2"></script>
</body>
</html>
