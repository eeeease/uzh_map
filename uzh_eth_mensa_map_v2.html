<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>UZH × ETH Mensa Map v2</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

  <style>
    :root {
      --bg:#f5f7fb; --panel:#ffffff; --text:#14181f; --muted:#667085; --line:#e4e7ec;
      --uzh:#0063a6; --eth:#1f7a4c; --dark:#111827; --warn:#b54708;
      --chip:#f2f4f7; --ok:#027a48; --okbg:#ecfdf3; --dinner:#7a2e98; --dinnerbg:#f9f5ff;
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; background:var(--bg); color:var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; }
    #app { height:100%; display:grid; grid-template-rows:auto 1fr; min-height:0; }
    header {
      position:relative; z-index:1000; background:rgba(255,255,255,.97); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line); padding:10px 12px;
    }
    .top { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
    .title { font-weight:800; letter-spacing:-.03em; font-size:19px; }
    .subtitle { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.35; }
    .titleWrap { margin-right:auto; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .seg {
      display:flex; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:#fff;
    }
    .seg button {
      border:0; background:#fff; color:#475467; padding:8px 11px; min-height:38px;
    }
    .seg button.active { background:var(--dark); color:#fff; }
    .btn {
      border:1px solid var(--line); background:#fff; color:#344054; border-radius:12px;
      padding:8px 12px; min-height:38px;
    }
    .btn.primary { background:var(--dark); border-color:var(--dark); color:#fff; }
    .layout { min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) 410px; overflow:hidden; }
    #map { width:100%; height:100%; min-height:0; }
    main { min-width:0; min-height:0; height:100%; position:relative; }
    aside {
      min-width:0; min-height:0; overflow:auto; background:var(--panel); border-left:1px solid var(--line);
      display:flex; flex-direction:column;
    }
    #listView, #detailView { padding:14px; }
    #detailView { display:none; }
    .listHead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .listHead h2 { margin:0; font-size:18px; }
    .count { margin-left:auto; color:var(--muted); font-size:12px; }
    .search {
      width:100%; border:1px solid var(--line); border-radius:12px; outline:none;
      padding:10px 11px; margin-bottom:10px;
    }
    .search:focus { border-color:#98a2b3; box-shadow:0 0 0 3px rgba(152,162,179,.15); }
    .quickHint { font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.4; }
    .cards { display:flex; flex-direction:column; gap:8px; }
    .card {
      width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:14px;
      padding:11px; transition:.12s ease;
    }
    .card:hover { background:#fafbfc; border-color:#d0d5dd; }
    .row { display:flex; gap:8px; align-items:flex-start; }
    .school {
      font-size:11px; font-weight:800; padding:4px 7px; border-radius:999px; white-space:nowrap;
    }
    .school.uzh { color:var(--uzh); background:#eaf5fc; }
    .school.eth { color:var(--eth); background:#ebf7f0; }
    .name { font-weight:750; line-height:1.25; }
    .meta { margin-top:6px; display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
    .dist { font-weight:750; color:#344054; }
    .chips { margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
    .chip {
      display:inline-flex; align-items:center; gap:4px; background:var(--chip); color:#475467;
      border-radius:999px; padding:4px 8px; font-size:11px; font-weight:700;
    }
    .chip.dinner { background:var(--dinnerbg); color:var(--dinner); }
    .chip.open { background:var(--okbg); color:var(--ok); }
    .chip.closed { background:#fff7ed; color:#9a3412; }
    .empty { padding:20px 4px; color:var(--muted); text-align:center; font-size:13px; }
    .back { border:0; padding:0; background:transparent; font-weight:700; color:#344054; }
    .detailTitle { margin:10px 0 4px; font-size:24px; line-height:1.1; letter-spacing:-.03em; }
    .detailMeta { color:var(--muted); font-size:13px; line-height:1.5; }
    .slotWrap { margin-top:14px; }
    .slotBar { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
    .slotBtn {
      border:1px solid var(--line); background:#fff; border-radius:11px; padding:8px 10px; color:#344054; min-height:36px;
    }
    .slotBtn.active { background:var(--dark); color:#fff; border-color:var(--dark); }
    .sectionHead { display:flex; align-items:center; gap:8px; margin:16px 0 10px; }
    .sectionHead h3 { margin:0; font-size:15px; }
    .menuState { margin-left:auto; color:var(--muted); font-size:11px; }
    .menuCard { border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:8px; background:#fff; }
    .menuLine { font-size:12px; font-weight:800; color:#475467; margin-bottom:4px; }
    .menuName { font-weight:750; line-height:1.35; }
    .menuDesc { margin-top:5px; color:#667085; font-size:12px; line-height:1.42; }
    .menuPrice { margin-top:7px; font-size:12px; font-weight:800; }
    .notice { border:1px solid #fedf89; background:#fffaeb; color:#7a2e0e; border-radius:12px; padding:10px 11px; font-size:12px; line-height:1.45; }
    .notice.error { border-color:#fecdca; background:#fef3f2; color:#b42318; }
    .frameWrap { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
    .frame { display:block; width:100%; height:520px; border:0; background:#fff; }
    .frameActions, .detailActions {
      display:flex; gap:8px; flex-wrap:wrap; padding-top:9px; font-size:12px; color:#344054; font-weight:700;
    }
    .sourceNote { margin-top:8px; font-size:11px; color:var(--muted); line-height:1.4; }
    .legend {
      position:absolute; left:12px; bottom:16px; z-index:500; background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
      border:1px solid var(--line); border-radius:11px; padding:8px 10px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:11px;
    }
    .legend div { display:flex; align-items:center; gap:6px; margin:3px 0; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .dot.uzh { background:var(--uzh); }
    .dot.eth { background:var(--eth); }
    .dot.me { background:var(--dark); }
    .marker-label {
      background:#fff; border:1px solid rgba(0,0,0,.14); border-radius:999px; white-space:nowrap;
      padding:3px 7px; box-shadow:0 1px 5px rgba(0,0,0,.18); font-size:11px; font-weight:800;
    }
    .marker-label.uzh { color:var(--uzh); }
    .marker-label.eth { color:var(--eth); }
    .leaflet-tooltip.marker-label:before { display:none; }
    .leaflet-popup-content { margin:10px 12px; min-width:190px; }
    .popupName { font-weight:800; margin-bottom:5px; }
    .popupMeta { color:#667085; font-size:12px; line-height:1.4; }
    .popupServices { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .popupAction {
      margin-top:9px; width:100%; border:0; background:var(--dark); color:white;
      border-radius:10px; padding:8px 10px; font-weight:700;
    }
    .statusbar {
      position:absolute; top:72px; left:50%; transform:translateX(-50%); z-index:900; max-width:80%;
      display:none; text-align:center; background:rgba(17,24,39,.94); color:#fff; border-radius:999px;
      padding:8px 12px; font-size:12px; box-shadow:0 6px 16px rgba(0,0,0,.18);
    }
    .footerNote {
      margin-top:10px; font-size:11px; line-height:1.45; color:var(--muted);
    }
    @media (max-width: 920px) {
      html, body { overflow:auto; }
      #app { height:auto; min-height:100%; }
      .layout { grid-template-columns:1fr; grid-template-rows:minmax(390px,56vh) auto; overflow:auto; }
      aside { border-left:0; border-top:1px solid var(--line); overflow:visible; }
      #map { min-height:390px; height:56vh; }
      .statusbar { top:122px; }
      .titleWrap { width:100%; }
      main { height:56vh; min-height:390px; }
    }
    @media (max-width: 500px) {
      header { padding:9px; }
      .seg { flex:1 1 auto; }
      .seg button { flex:1 1 auto; padding:8px 7px; }
      .controls { width:100%; }
      .btn { padding:8px 10px; }
      #listView, #detailView { padding:12px; }
      .frame { height:500px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="titleWrap">
        <div class="title">UZH × ETH Mensa Map v2</div>
        <div class="subtitle">支持“只看晚餐 / 现在营业” · 地图找最近食堂 · 菜单直接由浏览器请求</div>
      </div>
      <div class="controls">
        <div class="seg" aria-label="学校筛选">
          <button class="schoolFilter active" data-value="ALL">全部</button>
          <button class="schoolFilter" data-value="UZH">UZH</button>
          <button class="schoolFilter" data-value="ETH">ETH</button>
        </div>
        <div class="seg" aria-label="餐次筛选">
          <button class="mealFilter active" data-value="ALL">全部</button>
          <button class="mealFilter" data-value="LUNCH">午餐</button>
          <button class="mealFilter" data-value="DINNER">晚餐</button>
          <button class="mealFilter" data-value="OPEN">现在营业</button>
        </div>
        <button id="locateBtn" class="btn primary">◎ 定位我</button>
        <button id="fitBtn" class="btn">显示全部</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <main>
      <div id="map"></div>
      <div id="statusbar" class="statusbar"></div>
      <div class="legend">
        <div><span class="dot uzh"></span>UZH</div>
        <div><span class="dot eth"></span>ETH</div>
        <div><span class="dot me"></span>我的位置</div>
      </div>
    </main>

    <aside>
      <section id="listView">
        <div class="listHead">
          <h2>餐厅列表</h2>
          <span id="count" class="count"></span>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索餐厅 / 校区…">
        <div id="quickHint" class="quickHint"></div>
        <div id="cards" class="cards"></div>
        <div class="footerNote">
          说明：<br>
          1. 晚餐筛选按“这家店是否提供 dinner 档”判断；学校在学期中 / 假期可能会临时调整。<br>
          2. 定位和距离计算完全在你的浏览器本地完成。<br>
          3. 若浏览器不允许定位，可直接点击地图任意位置，把该点设为“我的位置”。
        </div>
      </section>

      <section id="detailView">
        <button id="backBtn" class="back">← 返回列表</button>
        <div id="detail"></div>
      </section>
    </aside>
  </div>
</div>

  let schoolFilter = "ALL";

  const listView = document.getElementById("listView");
  const detailView = document.getElementById("detailView");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showStatus(msg, ms = 2600) {
    statusbar.textContent = msg;
    statusbar.style.display = "block";
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => statusbar.style.display = "none", ms);
  }

  function distanceMeters(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad;
    const dLng = (b.lng - a.lng) * rad;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function fmtDist(m) {
    if (m == null) return "";
    return m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;
  }

  function currentMinutes() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function parseRange(hours) {
    const clean = String(hours).replace(/\s/g, "");
    const [a,b] = clean.split("-");
    if (!a || !b) return null;
    const [ah,am] = a.split(":").map(Number);
    const [bh,bm] = b.split(":").map(Number);
    return {start:(ah*60)+(am||0), end:(bh*60)+(bm||0)};
  }

  function serviceOpenNow(service) {
    const r = parseRange(service.hours);
    if (!r) return false;
    const now = currentMinutes();
    return now >= r.start && now <= r.end;
  }

  function restaurantOpenNow(restaurant) {
    return restaurant.services.some(serviceOpenNow);
  }

  function hasService(restaurant, type) {
    return restaurant.services.some(s => s.type === type);
  }

  function getServiceBadges(restaurant) {
    const items = [];
    if (hasService(restaurant, "lunch")) items.push(`<span class="chip">午餐</span>`);
    if (hasService(restaurant, "dinner")) items.push(`<span class="chip dinner">晚餐</span>`);
    if (restaurantOpenNow(restaurant)) items.push(`<span class="chip open">现在营业</span>`);
    else items.push(`<span class="chip closed">已结束 / 未开始</span>`);
    return items.join("");
  }

  function filteredRestaurants() {
    let arr = restaurants.filter(r => schoolFilter === "ALL" || r.school === schoolFilter);
    const q = query.trim().toLowerCase();
    if (q) {
      arr = arr.filter(r => `${r.name} ${r.school} ${r.campus}`.toLowerCase().includes(q));
    }
    if (mealFilter === "LUNCH") arr = arr.filter(r => hasService(r, "lunch"));
    if (mealFilter === "DINNER") arr = arr.filter(r => hasService(r, "dinner"));
    if (mealFilter === "OPEN") arr = arr.filter(r => restaurantOpenNow(r));
    arr = arr.map(r => ({...r, distance:userPos ? distanceMeters(userPos, r) : null}));
    if (userPos) arr.sort((a,b) => (a.distance ?? 1e18) - (b.distance ?? 1e18));
    else arr.sort((a,b) => a.school.localeCompare(b.school) || a.campus.localeCompare(b.campus) || a.name.localeCompare(b.name));
    return arr;
  }

  function renderQuickHint(arr) {
    const dinnerCount = arr.filter(r => hasService(r, "dinner")).length;
    const openCount = arr.filter(r => restaurantOpenNow(r)).length;
    const nearest = (userPos && arr[0]) ? `${arr[0].name}（${fmtDist(arr[0].distance)}）` : "未定位";
    quickHintEl.innerHTML = `当前结果中：<strong>${arr.length}</strong> 家 · 可晚餐 <strong>${dinnerCount}</strong> 家 · 现在营业 <strong>${openCount}</strong> 家 · 最近的是 <strong>${esc(nearest)}</strong>`;
  }

  function renderList() {
    const arr = filteredRestaurants();
    countEl.textContent = `${arr.length} 家`;
    renderQuickHint(arr);
    if (!arr.length) {
      cardsEl.innerHTML = `<div class="empty">没有符合当前筛选条件的餐厅</div>`;
      return;
    }
    cardsEl.innerHTML = arr.map(r => `
      <button class="card" data-id="${esc(r.id)}">
        <div class="row">
          <span class="school ${r.school.toLowerCase()}">${esc(r.school)}</span>
          <div style="min-width:0;flex:1">
            <div class="name">${esc(r.name)}</div>
            <div class="meta">
              <span>${esc(r.campus)}</span>
              ${r.distance != null ? `<span class="dist">${esc(fmtDist(r.distance))}</span>` : ""}
            </div>
            <div class="chips">${getServiceBadges(r)}</div>
          </div>
        </div>
      </button>
    `).join("");
    cardsEl.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const r = restaurants.find(x => x.id === card.dataset.id);
        if (!r) return;
        map.setView([r.lat, r.lng], Math.max(map.getZoom(), 16), {animate:true});
        markers.get(r.id)?.openPopup();
        openDetail(r.id);
      });
    });
  }

  function serviceSummary(restaurant) {
    return restaurant.services.map(s => `${s.label} ${s.hours}`).join(" · ");
  }

  function markerIcon(restaurant) {
    const color = restaurant.school === "UZH" ? "#0063a6" : "#1f7a4c";
    return L.divIcon({
      className:"",
      html:`<div style="width:16px;height:16px;background:${color};border:3px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.35)"></div>`,
      iconSize:[16,16],
      iconAnchor:[8,8],
      popupAnchor:[0,-8]
    });
  }

  function addMarkers() {
    restaurants.forEach(r => {
      const marker = L.marker([r.lat, r.lng], {icon:markerIcon(r)}).addTo(map);
      marker.bindTooltip(esc(r.name), {direction:"top", offset:[0,-8], className:`marker-label ${r.school.toLowerCase()}`});
      marker.bindPopup(() => {
        const d = userPos ? fmtDist(distanceMeters(userPos, r)) : "";
        const popupBadges = [
          hasService(r, "lunch") ? `<span class="chip">午餐</span>` : "",
          hasService(r, "dinner") ? `<span class="chip dinner">晚餐</span>` : "",
          restaurantOpenNow(r) ? `<span class="chip open">现在营业</span>` : ""
        ].filter(Boolean).join("");
        return `
          <div class="popupName">${esc(r.name)}</div>
          <div class="popupMeta">${esc(r.school)} · ${esc(r.campus)}${d ? " · " + esc(d) : ""}<br>${esc(serviceSummary(r))}</div>
          <div class="popupServices">${popupBadges}</div>
          <button class="popupAction" data-open-id="${esc(r.id)}">查看菜单</button>
        `;
      });
      marker.on("popupopen", e => {
        const btn = e.popup.getElement()?.querySelector("[data-open-id]");
        if (btn) btn.addEventListener("click", () => openDetail(r.id), {once:true});
      });
      markers.set(r.id, marker);
    });
    refreshMarkers();
  }

  function refreshMarkers() {
    const visible = new Set(filteredRestaurants().map(r => r.id));
    restaurants.forEach(r => {
      const marker = markers.get(r.id);
      if (!marker) return;
      const hasLayer = map.hasLayer(marker);
      if (visible.has(r.id) && !hasLayer) marker.addTo(map);
      if (!visible.has(r.id) && hasLayer) map.removeLayer(marker);
    });
    renderList();
    fitVisible();
  }

  function fitVisible() {
    const arr = filteredRestaurants();
    if (!arr.length) return;
    const bounds = L.latLngBounds(arr.map(r => [r.lat, r.lng]));
    if (userPos) bounds.extend([userPos.lat, userPos.lng]);
    map.fitBounds(bounds.pad(0.12), {maxZoom:15});
  }

  function setUserPosition(lat, lng, source="manual") {
    userPos = {lat, lng};
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lng], {
      radius:8, color:"#fff", weight:3, fillColor:"#111827", fillOpacity:1
    }).addTo(map).bindTooltip("我的位置", {direction:"top"});
    if (source === "gps") map.setView([lat, lng], 15, {animate:true});
    refreshMarkers();
    const nearest = filteredRestaurants()[0];
    if (nearest) showStatus(`最近：${nearest.name} · ${fmtDist(nearest.distance)}`, 3600);
    if (selectedRestaurantId) openDetail(selectedRestaurantId, selectedServiceType);
    fitVisible();
  }

  function locateMe() {
    if (!navigator.geolocation) {
      showStatus("当前浏览器不支持定位，请直接点击地图设定位置。", 3500);
      return;
    }
    showStatus("正在定位…", 5000);
    navigator.geolocation.getCurrentPosition(
      pos => setUserPosition(pos.coords.latitude, pos.coords.longitude, "gps"),
      () => showStatus("定位未授权。你可以点击地图任意位置，将其设为当前位置。", 4200),
      {enableHighAccuracy:true, timeout:10000, maximumAge:30000}
    );
  }

  function defaultServiceFor(restaurant) {
    if (mealFilter === "DINNER" && hasService(restaurant, "dinner")) return "dinner";
    if (mealFilter === "LUNCH" && hasService(restaurant, "lunch")) return "lunch";
    const open = restaurant.services.find(serviceOpenNow);
    if (open) return open.type;
    const dinner = restaurant.services.find(s => s.type === "dinner");
    if (dinner && currentMinutes() >= 15*60) return "dinner";
    return restaurant.services[0]?.type || null;
  }

  function getRestaurant(id) {
    return restaurants.find(r => r.id === id) || null;
  }

  function getService(restaurant, type) {
    return restaurant.services.find(s => s.type === type) || null;
  }

  function mondayISO(date = new Date()) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function dateISO(date = new Date()) {
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
  }

  function ethFallbackUrl(service) {
    return `https://ethz.ch/en/campus/getting-to-know/cafes-restaurants-shops/gastronomy/menueplaene/offerWeek.html?date=${encodeURIComponent(mondayISO())}&id=${encodeURIComponent(service.facilityId)}`;
  }

  async function loadETHRaw() {
    if (ethCache) return ethCache;
    if (ethFetchPromise) return ethFetchPromise;
    const url = `https://idapps.ethz.ch/cookpit-pub-services/v1/weeklyrotas?client-id=ethz-wcms&lang=en&rs-first=0&rs-size=150&valid-after=${encodeURIComponent(mondayISO())}`;
    ethFetchPromise = fetch(url, {method:"GET", mode:"cors", credentials:"omit"})
      .then(async res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        ethCache = data;
        return data;
      })
      .finally(() => { ethFetchPromise = null; });
    return ethFetchPromise;
  }

  function parseETHMenus(root, service) {
    const weekly = root?.["weekly-rota-array"] || [];
    const dayJS = new Date().getDay();
    const wantedDay = dayJS === 0 ? 7 : dayJS;
    const target = service.type === "dinner" ? "dinner" : "lunch";
    const out = [];
    const seen = new Set();
    const isPlaceholder = v => {
      const s = String(v ?? "").trim().toLowerCase();
      return s === "" || s === "novalue" || s === "-" || s === "none" || s === "n/a";
    };
    for (const rota of weekly) {
      if (Number(rota["facility-id"]) !== Number(service.facilityId)) continue;
      for (const day of (rota["day-of-week-array"] || [])) {
        if (Number(day["day-of-week-code"]) !== wantedDay) continue;
        for (const opening of (day["opening-hour-array"] || [])) {
          for (const mealTime of (opening["meal-time-array"] || [])) {
            const n = String(mealTime.name || "").toLowerCase();
            const matched = target === "dinner"
              ? /(dinner|abend|cena)/.test(n)
              : /(lunch|mittag|pranzo)/.test(n);
            if (!matched) continue;
            for (const line of (mealTime["line-array"] || [])) {
              if (!line.meal) continue;
              const meal = line.meal;
              const name = String(meal.name || "").trim();
              const description = String(meal.description || "").trim();
              if (isPlaceholder(name)) continue;
              const mealPrices = (meal["meal-price-array"] || [])
                .map(p => ({ price: p.price, group: p["customer-group-desc-short"] || p["customer-group-desc"] || "" }))
                .filter(p => p.price != null && !isPlaceholder(p.price));
              const key = [line.name || "", name, mealPrices.map(p => p.price).join(",")].join("|");
              if (seen.has(key)) continue;
              seen.add(key);
              out.push({
                line: line.name || "",
                name,
                description: isPlaceholder(description) ? "" : String(meal.description || "").replace(/\s+/g, " ").trim(),
                prices: mealPrices,
                vegetarian: (meal["meal-class-array"] || []).some(x => /vegetari/i.test(x.desc || "")),
                vegan: (meal["meal-class-array"] || []).some(x => /vegan/i.test(x.desc || ""))
              });
            }
          }
        }
      }
    }
    return out;
  }

  async function renderETHMenu(service, container) {
    container.innerHTML = `<div class="notice">正在由你的浏览器直接请求 ETH Cookpit 菜单…</div>`;
    try {
      const root = await loadETHRaw();
      const menus = parseETHMenus(root, service);
      if (!menus.length) {
        container.innerHTML = `
          <div class="notice">Cookpit 今天没有返回这个餐次的菜单。可能是休息、假期时段、当前不是该餐次，或者菜单尚未发布。</div>
          <div class="frameActions">
            <a target="_blank" rel="noopener" href="${esc(ethFallbackUrl(service))}">打开 ETH 官方周菜单 ↗</a>
          </div>`;
        return;
      }
      container.innerHTML = menus.map(m => {
        const flags = [m.vegan ? "Vegan" : "", !m.vegan && m.vegetarian ? "Vegetarian" : ""].filter(Boolean).join(" · ");
        const priceText = m.prices.slice(0,4).map(p => `${p.group ? esc(p.group)+": " : ""}CHF ${Number(p.price).toFixed(2)}`).join(" · ");
        return `
          <div class="menuCard">
            <div class="menuLine">${esc(m.line)}${flags ? " · " + esc(flags) : ""}</div>
            <div class="menuName">${esc(m.name)}</div>
            ${m.description ? `<div class="menuDesc">${esc(m.description)}</div>` : ""}
            ${priceText ? `<div class="menuPrice">${priceText}</div>` : ""}
          </div>`;
      }).join("") + `<div class="sourceNote">数据源：ETH Cookpit。请求是你的浏览器直接发给 idapps.ethz.ch 的，不经过你部署这个 HTML 的服务器。</div>`;
    } catch (err) {
      container.innerHTML = `
        <div class="notice error">浏览器没有成功读取 ETH Cookpit。可能是 CORS、网络策略或接口暂时不可用。</div>
        <div class="frameActions">
          <a target="_blank" rel="noopener" href="${esc(ethFallbackUrl(service))}">打开 ETH 官方周菜单 ↗</a>
        </div>`;
    }
  }

  function renderUZHMenu(service, container) {
    container.innerHTML = `
      <div class="frameWrap">
        <iframe class="frame" src="${esc(service.menuUrl)}" loading="eager" title="UZH menu"></iframe>
      </div>
      <div class="frameActions">
        <a target="_blank" rel="noopener" href="${esc(service.menuUrl)}">在新标签页打开菜单 ↗</a>
      </div>
      <div class="sourceNote">UZH 菜单由你的浏览器直接从 app.food2050.ch 加载，不需要你自己的后端。</div>`;
  }

  function openDetail(id, desiredServiceType = null) {
    const restaurant = getRestaurant(id);
    if (!restaurant) return;
    selectedRestaurantId = id;
    selectedServiceType = desiredServiceType || defaultServiceFor(restaurant);

    listView.style.display = "none";
    detailView.style.display = "block";

    const distance = userPos ? fmtDist(distanceMeters(userPos, restaurant)) : "";
    detailEl.innerHTML = `
      <div class="detailTitle">${esc(restaurant.name)}</div>
      <div class="detailMeta">
        ${esc(restaurant.school)} · ${esc(restaurant.campus)}${distance ? ` · <strong>${esc(distance)}</strong>` : ""}<br>
        餐次：${esc(serviceSummary(restaurant))}
      </div>

      <div class="slotWrap">
        <div style="font-size:13px;font-weight:800;">选择餐次</div>
        <div id="slotBar" class="slotBar">
          ${restaurant.services.map(s => {
            const open = serviceOpenNow(s) ? " · 现在营业" : "";
            return `<button class="slotBtn ${selectedServiceType === s.type ? "active" : ""}" data-slot="${esc(s.type)}">${esc(s.label)} ${esc(s.hours)}${esc(open)}</button>`;
          }).join("")}
        </div>
      </div>

      <div class="sectionHead">
        <h3>今日菜单 · ${esc(dateISO())}</h3>
        <span class="menuState">${restaurant.school === "ETH" ? "Cookpit API" : "FOOD2050"}</span>
      </div>
      <div id="menuContainer"></div>

      <div class="detailActions">
        <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(restaurant.lat)}&mlon=${encodeURIComponent(restaurant.lng)}#map=18/${encodeURIComponent(restaurant.lat)}/${encodeURIComponent(restaurant.lng)}">在 OSM 打开 ↗</a>
        ${restaurant.official ? `<a target="_blank" rel="noopener" href="${esc(restaurant.official)}">官方餐厅页 ↗</a>` : ""}
      </div>
      <div class="sourceNote">提示：晚餐档是否实际开放，学校可能在假期调整；如果你发现菜单为空，点官方入口核对即可。</div>
    `;

    const slotBar = document.getElementById("slotBar");
    const menuContainer = document.getElementById("menuContainer");
    slotBar.querySelectorAll(".slotBtn").forEach(btn => {
      btn.addEventListener("click", () => openDetail(restaurant.id, btn.dataset.slot));
    });

    const service = getService(restaurant, selectedServiceType) || restaurant.services[0];
    if (!service) {
      menuContainer.innerHTML = `<div class="notice error">没有找到该餐次配置。</div>`;
      return;
    }

    if (restaurant.school === "ETH") renderETHMenu(service, menuContainer);
    else renderUZHMenu(service, menuContainer);
  }

  function backToList() {
    detailView.style.display = "none";
    listView.style.display = "block";
  }

  document.querySelectorAll(".schoolFilter").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".schoolFilter").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      schoolFilter = btn.dataset.value;
      refreshMarkers();
    });
  });

  document.querySelectorAll(".mealFilter").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mealFilter").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mealFilter = btn.dataset.value;
      refreshMarkers();
    });
  });

  document.getElementById("search").addEventListener("input", e => {
    query = e.target.value || "";
    refreshMarkers();
  });

  document.getElementById("locateBtn").addEventListener("click", locateMe);
  document.getElementById("fitBtn").addEventListener("click", fitVisible);
  document.getElementById("backBtn").addEventListener("click", backToList);

  map.on("click", e => {
    if (confirm("把这里设为你的当前位置，用来计算最近餐厅吗？")) {
      setUserPosition(e.latlng.lat, e.latlng.lng, "manual");
    }
  });

  addMarkers();
  fitMapToContent();

  setTimeout(() => loadETHRaw().catch(() => {}), 500);
})();
</script>
</body>
</html>
